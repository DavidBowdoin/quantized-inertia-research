<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">QI inertial-mass ratio versus acceleration</title>
<desc id="d">Computed curves of m_i/m = 1 - 2c^2/(|a| Theta) for Theta = 2.607e26 m (2c/H, H = 2.3e-18 per s, as in McCulloch 2007) and Theta = 8.8e26 m (co-moving diameter, McCulloch 2017 onward), with the MOND simple interpolation function mu = x/(1+x), a0 = 1.2e-10 m/s^2, for comparison. QI gives no physical solution below a = 2c^2/Theta.</desc>
