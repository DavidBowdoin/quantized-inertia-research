<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Quantized Inertia evidence map</title>
<desc id="d">Phenomena that Quantized Inertia has been applied to, grouped and colour-coded by status as of October 2026: green = fit claimed by QI author(s) and not independently confirmed; amber = contested or inconclusive; red = refuted, explained conventionally, or null experimental test; grey = test never produced data. Status reflects the sources collected in this repository, not a verdict on the theory.</desc>
<rect width="1000" height="800" fill="#ffffff"/>
<text x="500.0" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a1a">Quantized Inertia: what it has been applied to, and where each claim stands</text>
<rect x="95" y="50" width="18" height="18" rx="3" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
<text x="120" y="64" font-size="12.5" fill="#1a1a1a">Claimed fit (QI authors only)</text>
<rect x="310" y="50" width="18" height="18" rx="3" fill="#fff4d6" stroke="#b07800" stroke-width="2"/>
<text x="335" y="64" font-size="12.5" fill="#1a1a1a">Contested / inconclusive</text>
<rect x="525" y="50" width="18" height="18" rx="3" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
<text x="550" y="64" font-size="12.5" fill="#1a1a1a">Refuted or null test</text>
<rect x="740" y="50" width="18" height="18" rx="3" fill="#eeeeee" stroke="#757575" stroke-width="2"/>
<text x="765" y="64" font-size="12.5" fill="#1a1a1a">No result (test never ran)</text>
<text x="140" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2e7d32">Astrophysics (mostly author-only)</text>
<line x1="500" y1="380" x2="140" y2="135" stroke="#2e7d32" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="140" y2="197" stroke="#2e7d32" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="140" y2="259" stroke="#2e7d32" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="140" y2="321" stroke="#2e7d32" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="140" y2="383" stroke="#2e7d32" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="140" y2="445" stroke="#2e7d32" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="140" y2="507" stroke="#2e7d32" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="140" y2="569" stroke="#2e7d32" stroke-width="1.4" opacity="0.45"/>
<text x="860" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#b07800">Disputed claims and premises</text>
<line x1="500" y1="380" x2="860" y2="135" stroke="#b07800" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="860" y2="201" stroke="#b07800" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="860" y2="267" stroke="#b07800" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="860" y2="333" stroke="#b07800" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="860" y2="399" stroke="#b07800" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="860" y2="465" stroke="#b07800" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="860" y2="531" stroke="#b07800" stroke-width="1.4" opacity="0.45"/>
<text x="500.0" y="665" text-anchor="middle" font-size="13" font-weight="bold" fill="#c62828">Solar-system and laboratory / propulsion tests</text>
<line x1="500" y1="380" x2="120" y2="705" stroke="#c62828" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="310" y2="705" stroke="#c62828" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="500" y2="705" stroke="#c62828" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="690" y2="705" stroke="#c62828" stroke-width="1.4" opacity="0.45"/>
<line x1="500" y1="380" x2="880" y2="705" stroke="#757575" stroke-width="1.4" opacity="0.45"/>
<rect x="22.0" y="110.0" width="236" height="50" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="140" y="131" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Galaxy rotation / RAR</text><text x="140" y="149" text-anchor="middle" font-size="11.5" fill="#333">McCulloch 2012, 2017 (SPARC)</text>
<rect x="22.0" y="172.0" width="236" height="50" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="140" y="193" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Baryonic Tully–Fisher</text><text x="140" y="211" text-anchor="middle" font-size="11.5" fill="#333">v⁴ = 2GMc²/Θ (2012)</text>
<rect x="22.0" y="234.0" width="236" height="50" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="140" y="255" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Cosmic acceleration</text><text x="140" y="273" text-anchor="middle" font-size="11.5" fill="#333">min. accel. ~2c²/Θ (2007, 2010)</text>
<rect x="22.0" y="296.0" width="236" height="50" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="140" y="317" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Min. disc-galaxy mass</text><text x="140" y="335" text-anchor="middle" font-size="11.5" fill="#333">~10⁹ M☉ (2010)</text>
<rect x="22.0" y="358.0" width="236" height="50" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="140" y="379" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Milky Way dwarf satellites</text><text x="140" y="397" text-anchor="middle" font-size="11.5" fill="#333">McCulloch 2017</text>
<rect x="22.0" y="420.0" width="236" height="50" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="140" y="441" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Proxima Centauri orbit</text><text x="140" y="459" text-anchor="middle" font-size="11.5" fill="#333">McCulloch 2024 (MNRAS Lett.)</text>
<rect x="22.0" y="482.0" width="236" height="50" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="140" y="503" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Jupiter-mass binaries</text><text x="140" y="521" text-anchor="middle" font-size="11.5" fill="#333">McCulloch 2025</text>
<rect x="22.0" y="544.0" width="236" height="50" rx="8" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/><text x="140" y="565" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Proton-radius anomaly</text><text x="140" y="583" text-anchor="middle" font-size="11.5" fill="#333">McCulloch 2017 (partial)</text>
<rect x="742.0" y="110.0" width="236" height="50" rx="8" fill="#fff4d6" stroke="#b07800" stroke-width="2"/><text x="860" y="131" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Wide binaries (Gaia)</text><text x="860" y="149" text-anchor="middle" font-size="11.5" fill="#333">Hernandez, Chae vs Banik 2023</text>
<rect x="742.0" y="176.0" width="236" height="50" rx="8" fill="#fff4d6" stroke="#b07800" stroke-width="2"/><text x="860" y="197" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Earth flyby anomalies</text><text x="860" y="215" text-anchor="middle" font-size="11.5" fill="#333">2008; anomaly itself unsettled</text>
<rect x="742.0" y="242.0" width="236" height="50" rx="8" fill="#fff4d6" stroke="#b07800" stroke-width="2"/><text x="860" y="263" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Tajmar / Podkletnov effects</text><text x="860" y="281" text-anchor="middle" font-size="11.5" fill="#333">2010–11; effects unconfirmed</text>
<rect x="742.0" y="308.0" width="236" height="50" rx="8" fill="#fff4d6" stroke="#b07800" stroke-width="2"/><text x="860" y="329" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Symmetric-capacitor thrust</text><text x="860" y="347" text-anchor="middle" font-size="11.5" fill="#333">Bhatt 2018; cf. Tajmar 2020 null</text>
<rect x="742.0" y="374.0" width="236" height="50" rx="8" fill="#fff4d6" stroke="#b07800" stroke-width="2"/><text x="860" y="395" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">IVO drive, OTP-2 flight</text><text x="860" y="413" text-anchor="middle" font-size="11.5" fill="#333">2025; McCulloch: inconclusive</text>
<rect x="742.0" y="440.0" width="236" height="50" rx="8" fill="#fff4d6" stroke="#b07800" stroke-width="2"/><text x="860" y="461" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">The derivation itself</text><text x="860" y="479" text-anchor="middle" font-size="11.5" fill="#333">Renda 2019; Dickmann 2023</text>
<rect x="742.0" y="506.0" width="236" height="50" rx="8" fill="#fff4d6" stroke="#b07800" stroke-width="2"/><text x="860" y="527" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Unruh radiation as cause</text><text x="860" y="545" text-anchor="middle" font-size="11.5" fill="#333">not directly observed</text>
<rect x="30.0" y="680.0" width="180" height="50" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/><text x="120" y="701" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Pioneer anomaly</text><text x="120" y="719" text-anchor="middle" font-size="10.8" fill="#333">thermal recoil (Turyshev 2012)</text>
<rect x="220.0" y="680.0" width="180" height="50" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/><text x="310" y="701" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Pioneer inside 10 AU</text><text x="310" y="719" text-anchor="middle" font-size="10.8" fill="#333">predicted, not seen (2007)</text>
<rect x="410.0" y="680.0" width="180" height="50" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/><text x="500" y="701" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">EmDrive thrust</text><text x="500" y="719" text-anchor="middle" font-size="10.8" fill="#333">artefacts (Tajmar et al. 2021)</text>
<rect x="600.0" y="680.0" width="180" height="50" rx="8" fill="#fdecea" stroke="#c62828" stroke-width="2"/><text x="690" y="701" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">Laser resonators</text><text x="690" y="719" text-anchor="middle" font-size="10.8" fill="#333">no thrust (Neunzig et al. 2021)</text>
<rect x="790.0" y="680.0" width="180" height="50" rx="8" fill="#eeeeee" stroke="#757575" stroke-width="2"/><text x="880" y="701" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#1a1a1a">IVO drive, Barry-1</text><text x="880" y="719" text-anchor="middle" font-size="10.8" fill="#333">satellite failed Feb 2024</text>
<ellipse cx="500" cy="380" rx="150" ry="78" fill="#efeaf8" stroke="#5b3f99" stroke-width="3"/>
<text x="500" y="356" text-anchor="middle" font-size="20" font-weight="bold" fill="#2d1f52">Quantized Inertia</text>
<text x="500" y="376" text-anchor="middle" font-size="13" fill="#2d1f52">(MiHsC, McCulloch 2007–)</text>
<text x="500" y="400" text-anchor="middle" font-size="14" fill="#2d1f52">mᵢ = m(1 − 2c²/(|a|Θ))</text>
<text x="500" y="420" text-anchor="middle" font-size="12" fill="#2d1f52">claims no adjustable parameters</text>
<text x="500.0" y="782" text-anchor="middle" font-size="11.5" fill="#555">Status as of Oct 2026, from sources in this repository. "Claimed fit" means published by McCulloch or co-authors without independent confirmation, not that the fit is wrong.</text>
</svg>
